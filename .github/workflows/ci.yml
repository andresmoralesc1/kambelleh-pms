name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kambelleh-pms/backend/package-lock.json
      - run: cd kambelleh-pms/backend && npm ci
      - run: cd kambelleh-pms/backend && npm run lint || true
      - run: cd kambelleh-pms/backend && npm test || true

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kambelleh-pms/frontend/package-lock.json
      - run: cd kambelleh-pms/frontend && npm ci
      - run: cd kambelleh-pms/frontend && npm run lint || true
      - run: cd kambelleh-pms/frontend && npm run build

  docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./kambelleh-pms
          file: ./kambelleh-pms/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/kambelleh-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kambelleh-pms/frontend
          file: ./kambelleh-pms/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/kambelleh-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
